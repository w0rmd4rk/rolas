<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17132B">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://i.ytimg.com data: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.googleapis.com https://www.youtube.com; frame-src https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Rolas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17132B; --surface:#221C3D; --surface-2:#2D2650; --mini:#4A3A17; --text:#EEEAF8;
  --muted:#9C95B8; --accent:#F2B33D; --accent-ink:#2A1D00;
  --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{width:24px;height:24px;fill:currentColor;flex:none}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--text)}
.icon-btn.on{color:var(--accent)}

/* Encabezado */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.top h1{font-size:1.6rem;font-weight:800;margin:0;letter-spacing:-.03em}
main{flex:1;overflow-y:auto;padding:4px 16px 16px}
.view{display:none;max-width:760px;margin:0 auto}
.view.active{display:block}
h2.sec{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin:22px 0 10px}

/* Inicio */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:8px;overflow:hidden;text-align:left;height:56px}
.tile:active{background:var(--surface-2)}
.tile b{font-size:.9rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:8px}
.cover{width:56px;height:56px;flex:none;background:var(--surface-2);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.one{grid-template-columns:1fr}
.shelf{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.card{width:140px;flex:none;text-align:left}
.card img{width:140px;height:140px;object-fit:cover;border-radius:8px;display:block;background:var(--surface)}
.card b{display:block;font-size:.9rem;margin-top:8px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card span{color:var(--muted);font-size:.8rem}
.welcome{background:var(--surface);border-radius:12px;padding:20px;margin-top:8px}
.welcome p{margin:0 0 14px;color:var(--muted)}

/* Formularios y listas */
.bar{display:flex;gap:8px;margin:8px 0 12px}
.bar input{flex:1;min-width:0;background:var(--text);color:var(--bg);border:0;border-radius:8px;padding:12px 14px}
.bar input::placeholder{color:#5D5775}
.bar input.dark{background:var(--surface);color:var(--text)}
.bar input.dark::placeholder{color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:10px 18px;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.hint{color:var(--muted);font-size:.9rem;margin:4px 0 12px}
.list{list-style:none;margin:0;padding:0}
.track{display:flex;align-items:center;gap:12px;padding:6px 0}
.track.playing .t-title{color:var(--accent)}
.track img{width:52px;height:52px;object-fit:cover;border-radius:6px;flex:none;background:var(--surface-2)}
.t-main{flex:1;min-width:0;text-align:left}
.t-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-sub{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-head{display:flex;align-items:center;gap:10px;margin:20px 0 6px}
.pl-head h2{font-size:1.15rem;margin:0;flex:1;min-width:0}
.empty{color:var(--muted);padding:20px 0}

/* Mini reproductor */
footer{flex:none;background:linear-gradient(transparent,var(--bg) 28px);padding:0 8px}
.mini{position:relative;display:flex;align-items:center;gap:10px;background:var(--mini);border-radius:10px;padding:8px;margin-bottom:6px}
.mini[hidden]{display:none}
.mslot{width:44px;height:44px;border-radius:6px;flex:none;background:#000 center/cover no-repeat}
.minfo{flex:1;min-width:0;text-align:left}
.minfo .t-title{font-size:.95rem}
.minfo .t-sub{color:#D9CFB8}
.mini .icon-btn{color:var(--text)}
.mline{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
.mline i{display:block;height:100%;width:0;background:var(--text)}
.tabbar{display:flex;justify-content:space-around;padding:4px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:4px 0;min-width:0}
.tabbar button[aria-selected="true"]{color:var(--text)}

/* Pantalla de reproducción */
.sheet{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,#3B2F55 0%,var(--bg) 70%);
  display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 22px calc(env(safe-area-inset-bottom,0px) + 18px);
  transform:translateY(100%);transition:transform .25s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-top{display:flex;align-items:center;justify-content:space-between}
.sheet-top span{font-size:.85rem;font-weight:600}
.art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px 0}
.stage{width:100%;max-width:min(100%,52vh);aspect-ratio:1/1;border-radius:8px;background:#000 center/auto 133.4% no-repeat;
  box-shadow:0 16px 48px rgba(0,0,0,.45)}
.switch{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:10px;padding:12px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.switch small{display:block;color:var(--muted)}
.now{display:flex;align-items:center;gap:10px;margin-top:8px}
.now div{flex:1;min-width:0}
.now-title{font-size:1.4rem;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-sub{color:var(--muted);margin:2px 0 0}
.progress{margin-top:14px}
input[type=range]{width:100%;accent-color:var(--text);margin:0}
.times{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.controls .icon-btn{color:var(--text)}
.controls .icon-btn.on{color:var(--accent)}
.controls .icon-btn svg{width:30px;height:30px}
.controls .side svg{width:24px;height:24px}
.play{width:66px;height:66px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}
.play svg{width:32px;height:32px}
.sheet-bottom{display:flex;justify-content:flex-end;margin-top:auto;padding-top:16px}

/* El video real: un solo iframe que se acomoda sobre el mini o sobre la pantalla grande */
.video{position:fixed;z-index:15;overflow:hidden;background:#000;border-radius:6px}
.video.big{z-index:30;border-radius:8px;box-shadow:0 16px 48px rgba(0,0,0,.45)}
.video:not(.big){pointer-events:none}
.video.off{display:none}
.vin{position:absolute}
.vin iframe,#yt{width:100%;height:100%;display:block;border:0}

dialog{background:var(--surface);color:var(--text);border:0;border-radius:16px;padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(10,8,22,.7)}
dialog h3{margin:0 0 12px}
dialog .row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
dialog .opts button{display:block;width:100%;text-align:left;padding:12px 10px;border-radius:10px}
dialog .opts button:hover{background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:var(--text);color:var(--bg);z-index:40;
  padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.auth{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 48px) 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
body.locked .auth{display:block}
body.locked > header, body.locked > main, body.locked > footer, body.locked .video, body.locked .sheet{display:none !important}
.auth-box{max-width:380px;margin:0 auto}
.auth h1{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;margin:0}
.auth .lead{color:var(--muted);margin:6px 0 28px}
.auth label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
.auth input{width:100%;background:var(--surface);border:1px solid var(--surface-2);border-radius:10px;padding:13px 14px}
.auth input:focus{border-color:var(--accent);outline:none}
.auth .btn{width:100%;padding:14px;margin-top:22px;font-size:1rem}
.auth .link{color:var(--accent);font-weight:600;margin-top:16px;display:block;width:100%;text-align:center}
.auth .msg{min-height:1.4em;margin-top:14px;font-size:.92rem}
.auth .msg.err{color:#FF8A8A}
.auth .msg.ok{color:#9BE3A8}
.account{background:var(--surface-2);border-radius:10px;padding:12px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.account span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
/* Rutina y dieta */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);color:var(--muted);font-weight:600;font-size:.9rem}
.chip.on{background:var(--text);color:var(--bg)}
.chip.add{color:var(--accent)}
.days{display:flex;gap:8px;overflow-x:auto;padding:6px 0 4px;scrollbar-width:none}
.day{flex:none;text-align:left;padding:10px 14px;border-radius:12px;background:var(--surface);min-width:96px}
.day b{display:block;font-size:.95rem}
.day small{color:var(--muted);font-size:.78rem;white-space:nowrap}
.day.on{background:var(--accent);color:var(--accent-ink)}
.day.on small{color:var(--accent-ink);opacity:.75}
.sec-head{display:flex;align-items:flex-start;gap:8px;margin:20px 0 4px}
.sec-head div{flex:1;min-width:0}
.sec-head h2{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.2}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.meter{height:4px;background:var(--surface-2);border-radius:4px;margin:10px 0 14px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .2s}
.items{list-style:none;margin:0;padding:0;counter-reset:ex}
.item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--surface-2)}
.item:last-child{border-bottom:0}
.num{counter-increment:ex;width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none;margin-top:2px}
.num::before{content:counter(ex)}
.item-main{flex:1;min-width:0;text-align:left}
.item-main b{display:block;font-size:1rem;line-height:1.3}
.meta{color:var(--text);font-size:.9rem;margin-top:4px;font-weight:600}
.meta span{color:var(--muted);font-weight:400}
.note{color:var(--muted);font-size:.88rem;margin-top:6px;line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:6px;background:rgba(242,179,61,.16);color:var(--accent)}
.check{width:36px;height:36px;border-radius:50%;border:2px solid var(--surface-2);display:grid;place-items:center;flex:none;color:transparent;margin-top:-2px}
.check svg{width:20px;height:20px}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.done .item-main b{color:var(--muted);text-decoration:line-through}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.recs{background:var(--surface);border-radius:12px;padding:4px 16px;margin-top:22px}
.recs summary{font-weight:700;padding:12px 0;cursor:pointer}
.recs ul{margin:0 0 12px;padding-left:18px;color:var(--muted);line-height:1.5}
.recs li{margin-bottom:6px}
.empty-card{background:var(--surface);border-radius:12px;padding:20px;margin-top:8px}
.empty-card p{color:var(--muted);margin:0 0 14px}
.diet-head{background:var(--surface);border-radius:14px;padding:16px;display:flex;align-items:center;gap:10px;margin-top:6px}
.diet-head div{flex:1;min-width:0}
.diet-head b{display:block;font-size:1.15rem}
.diet-head span{color:var(--accent);font-weight:700}
#fBody label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 6px}
#fBody input,#fBody textarea{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:11px 12px;font:inherit;color:inherit;resize:vertical}
#fBody input:focus,#fBody textarea:focus{border-color:var(--accent);outline:none}
#fBody .tagpick{display:flex;flex-wrap:wrap;gap:6px}
#fBody .tagpick button{padding:7px 11px;border-radius:999px;background:var(--surface-2);font-size:.85rem;font-weight:600;color:var(--muted)}
#fBody .tagpick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#fBody .fbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
#fBody .danger{background:none;color:#FF8A8A;font-weight:700;margin-left:auto}
dialog{max-height:88vh;overflow-y:auto}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;margin:4px 0 10px}
.seg button{flex:1;padding:10px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface-2);color:var(--text)}
.crud{display:flex;align-items:center;gap:6px;margin:2px 0 4px}
.crud span{flex:1;min-width:0;font-weight:700;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.sm{padding:7px 12px;font-size:.85rem}
.kc{font-size:.78rem;font-weight:700;color:var(--accent);margin-left:4px}
.kcal-today{font-size:.95rem;margin:2px 0 -4px}
.kcal-today b{font-size:1.3rem;color:var(--accent)}
.pcard{background:var(--surface);border-radius:14px;padding:14px;margin-top:10px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.card-head small{display:block;color:var(--muted);font-size:.8rem}
.card-head b{font-size:1.35rem;font-weight:800}
.delta{font-size:.78rem;font-weight:700;padding:4px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.delta.down{color:#9BE3A8}.delta.up{color:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.12}
.chart circle{fill:var(--accent)}
.chart .grid{stroke:var(--surface-2);stroke-dasharray:3 4}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .bar{fill:var(--accent);opacity:.85}.chart .bar.over{fill:#FF8A8A}
.chart .goal{stroke:var(--text);stroke-dasharray:4 4;opacity:.6}
.pick{width:100%;background:var(--surface);border:0;border-radius:10px;padding:12px;font:inherit;color:inherit;margin-top:4px}
.lastw{margin-top:8px;font-size:.82rem;font-weight:700;color:var(--accent)}
.add-ex{width:100%;padding:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--surface-2);border-radius:10px;padding:10px}
.stats small{display:block;color:var(--muted);font-size:.75rem}
.stats b{font-size:1rem}
.hist-title{margin:18px 0 6px;font-size:.95rem}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--surface-2)}
.hist li div{flex:1;min-width:0}
.hist small{display:block;color:var(--muted);font-size:.8rem}
.hist p{margin:4px 0 0;font-size:.88rem;color:var(--text);opacity:.85}
#fBody .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#fBody select{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:11px 12px;font:inherit;color:inherit}
@media (prefers-reduced-motion:reduce){.toast,.sheet,.meter i{transition:none}}
@media (min-width:720px){.sheet{padding-left:calc(50% - 300px);padding-right:calc(50% - 300px)}}
</style>
</head>
<body class="locked">
<header class="top">
  <h1 id="greet">Rolas</h1>
  <button class="icon-btn" id="btnSettings" aria-label="Ajustes">
    <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4L10.7 6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.4 7.4 0 0 0 1.7 1l.3 2.7h4l.3-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
  </button>
</header>

<main>
  <section class="view active" id="view-inicio"><div id="home"></div></section>

  <section class="view" id="view-buscar">
    <div class="bar">
      <input id="q" type="search" placeholder="¿Qué quieres escuchar?" autocomplete="off" enterkeyhint="search">
    </div>
    <p class="hint" id="searchHint"></p>
    <ul class="list" id="results"></ul>
  </section>

  <section class="view" id="view-biblioteca">
    <div class="bar">
      <input id="newPl" class="dark" placeholder="Nombre de la nueva playlist">
      <button class="btn" id="btnNewPl">Crear</button>
    </div>
    <div id="library"></div>
  </section>

  <section class="view" id="view-gym">
    <div class="seg" role="tablist" aria-label="Sección del gym">
      <button role="tab" data-tab="ejercicio" aria-selected="true">Ejercicio</button>
      <button role="tab" data-tab="comida" aria-selected="false">Comida</button>
      <button role="tab" data-tab="progreso" aria-selected="false">Progreso</button>
    </div>
    <div id="rutina"></div>
    <div id="dieta" hidden></div>
    <div id="progreso" hidden></div>
  </section>

  <section class="view" id="view-cola">
    <div class="pl-head"><h2>Cola de reproducción</h2><button class="btn ghost" id="btnClearQ">Vaciar</button></div>
    <ul class="list" id="queue"></ul>
  </section>
</main>

<footer>
  <div class="mini" id="mini" hidden>
    <div class="mslot" id="mslot"></div>
    <button class="minfo" id="minfo" aria-label="Abrir reproductor">
      <div class="t-title" id="mTitle"></div>
      <div class="t-sub" id="mSub"></div>
    </button>
    <button class="icon-btn" id="mAdd" aria-label="Agregar a playlist"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm1-13h-2v4H7v2h4v4h2v-4h4v-2h-4z"/></svg></button>
    <button class="icon-btn" id="mPlay" aria-label="Reproducir"><svg viewBox="0 0 24 24" class="pi"><path d="M8 5v14l11-7z"/></svg></button>
    <div class="mline"><i id="mBar"></i></div>
  </div>
  <nav class="tabbar" role="tablist">
    <button role="tab" data-view="inicio" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg>Inicio</button>
    <button role="tab" data-view="buscar" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>Buscar</button>
    <button role="tab" data-view="biblioteca" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 3h2v18H4zm5 0h2v18H9zm5.5.6 1.9-.6 5.4 17.2-1.9.6z"/></svg>Biblioteca</button>
    <button role="tab" data-view="gym" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M2 10h2V8h2v8H4v-2H2zm4-3h3v10H6zm3 4h6v2H9zm6-4h3v10h-3zm3 1h2v2h2v4h-2v2h-2z"/></svg>Gym</button>
  </nav>
</footer>

<section class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-top">
    <button class="icon-btn" id="btnClose" aria-label="Cerrar reproductor"><svg viewBox="0 0 24 24"><path d="m6.4 8.6 5.6 5.6 5.6-5.6L19 10l-7 7-7-7z"/></svg></button>
    <span>Reproduciendo</span>
    <button class="icon-btn" id="btnToQueue" aria-label="Ver cola"><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 5h12v2H3zm0 5h8v2H3zm13-2.5V20l5-3.2z"/></svg></button>
  </div>
  <div class="art"><div class="stage" id="stage"></div></div>
  <div class="now">
    <div><h2 class="now-title" id="nowTitle"></h2><p class="now-sub" id="nowSub"></p></div>
    <button class="icon-btn" id="sAdd" aria-label="Agregar a playlist" style="color:var(--text)"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm1-13h-2v4H7v2h4v4h2v-4h4v-2h-4z"/></svg></button>
  </div>
  <div class="progress">
    <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Posición">
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  </div>
  <div class="controls">
    <button class="icon-btn side" id="btnShuffle" aria-label="Aleatorio"><svg viewBox="0 0 24 24"><path d="M14 4h6v6l-2.3-2.3-4.3 4.3-1.4-1.4 4.3-4.3zM4 5.4 5.4 4 20 18.6 18.6 20zM14 20v-2h2.6l-3.2-3.2 1.4-1.4 3.2 3.2V14h2v6z"/></svg></button>
    <button class="icon-btn" id="btnPrev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="play" id="btnPlay" aria-label="Reproducir"><svg viewBox="0 0 24 24" class="pi"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="icon-btn" id="btnNext" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <button class="icon-btn side" id="btnRepeat" aria-label="Repetir"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
  </div>
</section>

<div class="video off" id="video"><div class="vin" id="vin"><div id="yt"></div></div></div>

<dialog id="dlgSettings">
  <h3>Ajustes</h3>
  <div class="account"><span id="accEmail"></span><button class="btn ghost" id="btnLogout">Cerrar sesión</button></div>
  <div class="row">
    <label for="apiKey">API key de YouTube Data v3</label>
    <input id="apiKey" style="background:var(--surface-2);border:0;border-radius:10px;padding:10px">
    <small class="hint">Sin key puedes agregar canciones pegando su link en Buscar.</small>
  </div>
  <label class="switch row"><input type="checkbox" id="saver">
    <span><b>Ahorro de datos</b><small>Muestra la portada en lugar del video y reproduce en la calidad más baja. El audio no cambia.</small></span></label>
  <div class="row" style="flex-direction:row;flex-wrap:wrap;gap:8px">
    <button class="btn" id="btnSaveKey">Guardar</button>
    <button class="btn ghost" id="btnExport">Exportar biblioteca</button>
    <button class="btn ghost" id="btnImport">Importar</button>
  </div>
  <input type="file" id="fileImport" accept="application/json" hidden>
  <button class="btn ghost" data-close>Cerrar</button>
</dialog>

<dialog id="dlgAdd"><h3>Agregar a playlist</h3><div class="opts" id="addOpts"></div>
  <button class="btn ghost" data-close style="margin-top:8px">Cancelar</button></dialog>

<section class="auth" id="auth">
  <div class="auth-box">
    <h1>Rolas</h1>
    <p class="lead" id="authLead">Inicia sesión para escuchar tu música.</p>
    <form id="authForm" novalidate>
      <label for="authEmail">Correo</label>
      <input id="authEmail" type="email" autocomplete="email" required>
      <div id="passWrap">
        <label for="authPass">Contraseña</label>
        <input id="authPass" type="password" autocomplete="current-password" minlength="8" required>
      </div>
      <div id="pass2Wrap" hidden>
        <label for="authPass2">Repite la contraseña</label>
        <input id="authPass2" type="password" autocomplete="new-password" minlength="8">
      </div>
      <button class="btn" id="authSubmit" type="submit">Iniciar sesión</button>
    </form>
    <p class="msg" id="authMsg" role="status"></p>
    <button class="link" id="authSwitch" type="button">Crear cuenta</button>
    <button class="link" id="authForgot" type="button" style="color:var(--muted)">Olvidé mi contraseña</button>
  </div>
</section>

<dialog id="dlgForm"><h3 id="fTitle"></h3><form id="fBody" method="dialog" novalidate></form></dialog>
<dialog id="dlgMenu"><h3 id="mnTitle"></h3><div class="opts" id="mnOpts"></div>
  <button class="btn ghost" data-close style="margin-top:8px">Cancelar</button></dialog>
<dialog id="dlgEx"><h3 id="exTitle"></h3><div id="exBody"></div></dialog>
<input type="file" id="fileFit" accept="application/json" hidden>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
