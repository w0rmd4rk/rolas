<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17132B">
<title>Rolas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17132B; --surface:#221C3D; --surface-2:#2D2650; --mini:#4A3A17; --text:#EEEAF8;
  --muted:#9C95B8; --accent:#F2B33D; --accent-ink:#2A1D00;
  --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{width:24px;height:24px;fill:currentColor;flex:none}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--text)}
.icon-btn.on{color:var(--accent)}

/* Encabezado */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.top h1{font-size:1.6rem;font-weight:800;margin:0;letter-spacing:-.03em}
main{flex:1;overflow-y:auto;padding:4px 16px 16px}
.view{display:none;max-width:760px;margin:0 auto}
.view.active{display:block}
h2.sec{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin:22px 0 10px}

/* Inicio */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:8px;overflow:hidden;text-align:left;height:56px}
.tile:active{background:var(--surface-2)}
.tile b{font-size:.9rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:8px}
.cover{width:56px;height:56px;flex:none;background:var(--surface-2);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.one{grid-template-columns:1fr}
.shelf{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.card{width:140px;flex:none;text-align:left}
.card img{width:140px;height:140px;object-fit:cover;border-radius:8px;display:block;background:var(--surface)}
.card b{display:block;font-size:.9rem;margin-top:8px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card span{color:var(--muted);font-size:.8rem}
.welcome{background:var(--surface);border-radius:12px;padding:20px;margin-top:8px}
.welcome p{margin:0 0 14px;color:var(--muted)}

/* Formularios y listas */
.bar{display:flex;gap:8px;margin:8px 0 12px}
.bar input{flex:1;min-width:0;background:var(--text);color:var(--bg);border:0;border-radius:8px;padding:12px 14px}
.bar input::placeholder{color:#5D5775}
.bar input.dark{background:var(--surface);color:var(--text)}
.bar input.dark::placeholder{color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:10px 18px;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.hint{color:var(--muted);font-size:.9rem;margin:4px 0 12px}
.list{list-style:none;margin:0;padding:0}
.track{display:flex;align-items:center;gap:12px;padding:6px 0}
.track.playing .t-title{color:var(--accent)}
.track img{width:52px;height:52px;object-fit:cover;border-radius:6px;flex:none;background:var(--surface-2)}
.t-main{flex:1;min-width:0;text-align:left}
.t-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-sub{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-head{display:flex;align-items:center;gap:10px;margin:20px 0 6px}
.pl-head h2{font-size:1.15rem;margin:0;flex:1;min-width:0}
.empty{color:var(--muted);padding:20px 0}

/* Mini reproductor */
footer{flex:none;background:linear-gradient(transparent,var(--bg) 28px);padding:0 8px}
.mini{position:relative;display:flex;align-items:center;gap:10px;background:var(--mini);border-radius:10px;padding:8px;margin-bottom:6px}
.mini[hidden]{display:none}
.mslot{width:44px;height:44px;border-radius:6px;flex:none;background:#000 center/cover no-repeat}
.minfo{flex:1;min-width:0;text-align:left}
.minfo .t-title{font-size:.95rem}
.minfo .t-sub{color:#D9CFB8}
.mini .icon-btn{color:var(--text)}
.mline{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
.mline i{display:block;height:100%;width:0;background:var(--text)}
.tabbar{display:flex;justify-content:space-around;padding:4px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted);min-width:68px;padding:4px}
.tabbar button[aria-selected="true"]{color:var(--text)}

/* Pantalla de reproducción */
.sheet{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,#3B2F55 0%,var(--bg) 70%);
  display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 22px calc(env(safe-area-inset-bottom,0px) + 18px);
  transform:translateY(100%);transition:transform .25s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-top{display:flex;align-items:center;justify-content:space-between}
.sheet-top span{font-size:.85rem;font-weight:600}
.stage{width:100%;aspect-ratio:16/9;border-radius:10px;margin:auto 0 28px;background:#000}
.now{display:flex;align-items:center;gap:10px}
.now div{flex:1;min-width:0}
.now-title{font-size:1.4rem;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-sub{color:var(--muted);margin:2px 0 0}
.progress{margin-top:14px}
input[type=range]{width:100%;accent-color:var(--text);margin:0}
.times{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.controls .icon-btn{color:var(--text)}
.controls .icon-btn.on{color:var(--accent)}
.controls .icon-btn svg{width:30px;height:30px}
.controls .side svg{width:24px;height:24px}
.play{width:66px;height:66px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}
.play svg{width:32px;height:32px}
.sheet-bottom{display:flex;justify-content:flex-end;margin-top:auto;padding-top:16px}

/* El video real: un solo iframe que se acomoda sobre el mini o sobre la pantalla grande */
.video{position:fixed;z-index:15;overflow:hidden;background:#000;border-radius:6px}
.video.big{z-index:30;border-radius:10px}
.video:not(.big){pointer-events:none}
.video.off{display:none}
.vin{position:absolute}
.vin iframe,#yt{width:100%;height:100%;display:block;border:0}

dialog{background:var(--surface);color:var(--text);border:0;border-radius:16px;padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(10,8,22,.7)}
dialog h3{margin:0 0 12px}
dialog .row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
dialog .opts button{display:block;width:100%;text-align:left;padding:12px 10px;border-radius:10px}
dialog .opts button:hover{background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:var(--text);color:var(--bg);z-index:40;
  padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast,.sheet{transition:none}}
@media (min-width:720px){.sheet{padding-left:calc(50% - 300px);padding-right:calc(50% - 300px)}}
</style>
</head>
<body>
<header class="top">
  <h1 id="greet">Rolas</h1>
  <button class="icon-btn" id="btnSettings" aria-label="Ajustes">
    <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4L10.7 6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.4 7.4 0 0 0 1.7 1l.3 2.7h4l.3-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
  </button>
</header>

<main>
  <section class="view active" id="view-inicio"><div id="home"></div></section>

  <section class="view" id="view-buscar">
    <div class="bar">
      <input id="q" type="search" placeholder="¿Qué quieres escuchar?" autocomplete="off" enterkeyhint="search">
    </div>
    <p class="hint" id="searchHint"></p>
    <ul class="list" id="results"></ul>
  </section>

  <section class="view" id="view-biblioteca">
    <div class="bar">
      <input id="newPl" class="dark" placeholder="Nombre de la nueva playlist">
      <button class="btn" id="btnNewPl">Crear</button>
    </div>
    <div id="library"></div>
  </section>

  <section class="view" id="view-cola">
    <div class="pl-head"><h2>Cola de reproducción</h2><button class="btn ghost" id="btnClearQ">Vaciar</button></div>
    <ul class="list" id="queue"></ul>
  </section>
</main>

<footer>
  <div class="mini" id="mini" hidden>
    <div class="mslot" id="mslot"></div>
    <button class="minfo" id="minfo" aria-label="Abrir reproductor">
      <div class="t-title" id="mTitle"></div>
      <div class="t-sub" id="mSub"></div>
    </button>
    <button class="icon-btn" id="mAdd" aria-label="Agregar a playlist"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm1-13h-2v4H7v2h4v4h2v-4h4v-2h-4z"/></svg></button>
    <button class="icon-btn" id="mPlay" aria-label="Reproducir"><svg viewBox="0 0 24 24" class="pi"><path d="M8 5v14l11-7z"/></svg></button>
    <div class="mline"><i id="mBar"></i></div>
  </div>
  <nav class="tabbar" role="tablist">
    <button role="tab" data-view="inicio" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg>Inicio</button>
    <button role="tab" data-view="buscar" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>Buscar</button>
    <button role="tab" data-view="biblioteca" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 3h2v18H4zm5 0h2v18H9zm5.5.6 1.9-.6 5.4 17.2-1.9.6z"/></svg>Tu biblioteca</button>
    <button role="tab" data-view="cola" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 5h12v2H3zm0 5h8v2H3zm13-2.5V20l5-3.2z"/></svg>Cola</button>
  </nav>
</footer>

<section class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-top">
    <button class="icon-btn" id="btnClose" aria-label="Cerrar reproductor"><svg viewBox="0 0 24 24"><path d="m6.4 8.6 5.6 5.6 5.6-5.6L19 10l-7 7-7-7z"/></svg></button>
    <span>Reproduciendo</span>
    <button class="icon-btn" id="btnToQueue" aria-label="Ver cola"><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 5h12v2H3zm0 5h8v2H3zm13-2.5V20l5-3.2z"/></svg></button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="now">
    <div><h2 class="now-title" id="nowTitle"></h2><p class="now-sub" id="nowSub"></p></div>
    <button class="icon-btn" id="sAdd" aria-label="Agregar a playlist" style="color:var(--text)"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm1-13h-2v4H7v2h4v4h2v-4h4v-2h-4z"/></svg></button>
  </div>
  <div class="progress">
    <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Posición">
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  </div>
  <div class="controls">
    <button class="icon-btn side" id="btnShuffle" aria-label="Aleatorio"><svg viewBox="0 0 24 24"><path d="M14 4h6v6l-2.3-2.3-4.3 4.3-1.4-1.4 4.3-4.3zM4 5.4 5.4 4 20 18.6 18.6 20zM14 20v-2h2.6l-3.2-3.2 1.4-1.4 3.2 3.2V14h2v6z"/></svg></button>
    <button class="icon-btn" id="btnPrev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="play" id="btnPlay" aria-label="Reproducir"><svg viewBox="0 0 24 24" class="pi"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="icon-btn" id="btnNext" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <button class="icon-btn side" id="btnRepeat" aria-label="Repetir"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
  </div>
</section>

<div class="video off" id="video"><div class="vin" id="vin"><div id="yt"></div></div></div>

<dialog id="dlgSettings">
  <h3>Ajustes</h3>
  <div class="row">
    <label for="apiKey">API key de YouTube Data v3</label>
    <input id="apiKey" style="background:var(--surface-2);border:0;border-radius:10px;padding:10px">
    <small class="hint">Sin key puedes agregar canciones pegando su link en Buscar.</small>
  </div>
  <div class="row" style="flex-direction:row;flex-wrap:wrap;gap:8px">
    <button class="btn" id="btnSaveKey">Guardar</button>
    <button class="btn ghost" id="btnExport">Exportar biblioteca</button>
    <button class="btn ghost" id="btnImport">Importar</button>
  </div>
  <input type="file" id="fileImport" accept="application/json" hidden>
  <button class="btn ghost" onclick="this.closest('dialog').close()">Cerrar</button>
</dialog>

<dialog id="dlgAdd"><h3>Agregar a playlist</h3><div class="opts" id="addOpts"></div>
  <button class="btn ghost" onclick="this.closest('dialog').close()" style="margin-top:8px">Cancelar</button></dialog>

<div class="toast" id="toast"></div>

<script>
// ---------- Estado ----------
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch{ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} }
};
let library = store.get('rolas.library', [{ id:'fav', name:'Me gustan', tracks:[] }]);
let queue = store.get('rolas.queue', []);
let index = store.get('rolas.index', -1);
let recents = store.get('rolas.recents', []);
let shuffle = store.get('rolas.shuffle', false);
let repeat = store.get('rolas.repeat', 'off');
let apiKey = store.get('rolas.key', '');
let lastResults = [], lastQuery = '', nextPage = '';
let player, ready = false, pendingTrack = null, userPaused = false;

const save = () => { store.set('rolas.library', library); store.set('rolas.queue', queue); store.set('rolas.index', index);
  store.set('rolas.recents', recents); store.set('rolas.shuffle', shuffle); store.set('rolas.repeat', repeat) };
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s||0)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` };
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1800) }
function decode(s){ const d = document.createElement('textarea'); d.innerHTML = s; return d.value }
const current = () => queue[index];

// ---------- Navegación ----------
let currentView = 'inicio';
function showView(name){
  currentView = name;
  document.querySelectorAll('.tabbar button').forEach(x => x.setAttribute('aria-selected', x.dataset.view === name));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-'+name));
  $('#greet').textContent = { inicio: greeting(), buscar: 'Buscar', biblioteca: 'Tu biblioteca', cola: 'Cola' }[name];
  if (name === 'inicio') renderHome();
  if (name === 'biblioteca') renderLibrary();
  if (name === 'cola') renderQueue();
  if (name === 'buscar') setTimeout(() => !lastResults.length && $('#q').focus(), 50);
  $('main').scrollTop = 0;
}
function greeting(){ const h = new Date().getHours(); return h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches' }
document.querySelectorAll('.tabbar button').forEach(b => b.onclick = () => showView(b.dataset.view));

// ---------- Pantalla grande ----------
let sheetOpen = false;
function openSheet(){ if (!current()) return; history.pushState({ sheet: 1 }, ''); sheetOpen = true; $('#sheet').classList.add('open'); $('#sheet').setAttribute('aria-hidden','false');
  $('#video').classList.add('off'); setTimeout(placeVideo, 260) }
function closeSheet(){ sheetOpen = false; $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden','true');
  $('#video').classList.add('off'); setTimeout(placeVideo, 260) }
$('#minfo').onclick = openSheet; $('#mslot').onclick = openSheet;
const leaveSheet = () => history.state?.sheet ? history.back() : closeSheet();
$('#btnClose').onclick = leaveSheet;
$('#btnToQueue').onclick = () => { leaveSheet(); showView('cola') };
window.addEventListener('popstate', () => sheetOpen && closeSheet());

// Un solo iframe que nunca se mueve en el DOM (moverlo lo recargaría): solo se reacomoda encima del lugar visible.
function placeVideo(){
  const v = $('#video'), vin = $('#vin');
  const target = sheetOpen ? $('#stage') : (!$('#mini').hidden ? $('#mslot') : null);
  if (!target) { v.classList.add('off'); return }
  const r = target.getBoundingClientRect();
  if (!r.width) { v.classList.add('off'); return }
  v.classList.remove('off'); v.classList.toggle('big', sheetOpen);
  Object.assign(v.style, { left: r.left+'px', top: r.top+'px', width: r.width+'px', height: r.height+'px' });
  // En el mini el cuadro es cuadrado: el video 16:9 se recorta a los lados, como una portada.
  const w = Math.max(r.width, r.height * 16/9), h = w * 9/16;
  Object.assign(vin.style, { width: w+'px', height: h+'px', left: (r.width - w)/2+'px', top: (r.height - h)/2+'px' });
}
window.addEventListener('resize', placeVideo);

// ---------- Control desde la notificación ----------
// Android muestra los botones del "reproductor" que suena en la página principal. Como YouTube suena dentro
// de su propio marco, se reproduce en paralelo un audio en silencio de la app para que la notificación use
// los botones de Rolas (anterior / siguiente) y no los del marco de YouTube.
function silentWav(){
  const sr = 8000, n = sr, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
const keep = new Audio(silentWav()); keep.loop = true;
function keepAlive(on){ if (on) keep.play().catch(() => {}); else keep.pause() }

// ---------- YouTube ----------
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('yt', {
    host: 'https://www.youtube.com',
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 0, disablekb: 1, iv_load_policy: 3 },
    events: {
      onReady: () => { ready = true; const t = pendingTrack || current(); if (t) loadTrack(t, !!pendingTrack) },
      onStateChange: e => {
        // Si YouTube se pausa solo porque saliste de la app (y no fuiste tú), lo reanuda.
        if (e.data === YT.PlayerState.PAUSED && document.hidden && !userPaused) { resumeSoon(); return }
        setPlayIcon(e.data === YT.PlayerState.PLAYING);
        if (e.data === YT.PlayerState.PLAYING) keepAlive(true);
        if (e.data === YT.PlayerState.PAUSED && userPaused) keepAlive(false);
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = e.data === YT.PlayerState.PLAYING ? 'playing' : 'paused';
        if (e.data === YT.PlayerState.ENDED) next(true);
      },
      onError: () => { toast('Ese video no se puede reproducir, saltando'); next(true) }
    }
  });
};

function showTrackInfo(t){
  $('#mini').hidden = false;
  $('#mTitle').textContent = $('#nowTitle').textContent = t.title || 'Sin título';
  $('#mSub').textContent = $('#nowSub').textContent = t.channel || '';
  $('#mslot').style.backgroundImage = `url(${thumb(t.id)})`;
  requestAnimationFrame(placeVideo);
}
function loadTrack(t, autoplay = true){
  showTrackInfo(t);
  if (!ready) { pendingTrack = autoplay ? t : null; return }
  pendingTrack = null;
  if (autoplay) { userPaused = false; keepAlive(true) }
  autoplay ? player.loadVideoById(t.id) : player.cueVideoById(t.id);
  document.title = `${t.title} · Rolas`;
  if (autoplay) { recents = [t, ...recents.filter(x => x.id !== t.id)].slice(0, 20); save() }
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.channel || '',
      artwork: [{ src: `https://i.ytimg.com/vi/${t.id}/hqdefault.jpg`, sizes:'480x360', type:'image/jpeg' }] });
  }
  renderQueue(); markPlaying();
}

function playList(tracks, start = 0){
  if (!tracks.length) return;
  queue = tracks.slice(); index = start;
  if (shuffle) { const first = queue.splice(start,1)[0]; queue.sort(()=>Math.random()-.5); queue.unshift(first); index = 0 }
  save(); loadTrack(queue[index]);
}
function playNow(t){ queue.splice(index+1, 0, t); index++; save(); loadTrack(t) }
function enqueue(t){ queue.push(t); if (index < 0) { index = 0; loadTrack(t) } save(); toast('Agregada a la cola'); renderQueue() }
function next(auto = false){
  if (!queue.length) return;
  if (auto && repeat === 'one') { player.seekTo(0); player.playVideo(); return }
  if (index < queue.length - 1) index++;
  else if (repeat === 'all' || !auto) index = 0;
  else { keepAlive(false); return setPlayIcon(false) }
  save(); loadTrack(queue[index]);
}
function prev(){
  if (!queue.length) return;
  if (ready && player.getCurrentTime() > 4) return player.seekTo(0);
  index = index > 0 ? index - 1 : queue.length - 1; save(); loadTrack(queue[index]);
}
function togglePlay(){
  if (!ready || index < 0) return;
  const st = player.getPlayerState();
  if (st === YT.PlayerState.PLAYING) { userPaused = true; player.pauseVideo(); keepAlive(false) }
  else { userPaused = false; keepAlive(true); player.playVideo() }
}
function resumeSoon(){ [150, 600, 1500].forEach(ms => setTimeout(() => {
  if (ready && !userPaused && player.getPlayerState() !== YT.PlayerState.PLAYING) player.playVideo() }, ms)) }
document.addEventListener('visibilitychange', () => { if (document.hidden && !userPaused && index >= 0) resumeSoon() });
window.addEventListener('pagehide', () => { if (!userPaused) resumeSoon() });
function setPlayIcon(playing){
  document.querySelectorAll('.pi').forEach(p => p.innerHTML = playing ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>');
  ['#btnPlay','#mPlay'].forEach(id => $(id).setAttribute('aria-label', playing ? 'Pausar' : 'Reproducir'));
}
$('#btnPlay').onclick = togglePlay; $('#mPlay').onclick = togglePlay;
$('#btnNext').onclick = () => next(); $('#btnPrev').onclick = prev;
$('#mAdd').onclick = () => current() && askPlaylist(current());
$('#sAdd').onclick = () => current() && askPlaylist(current());
$('#btnShuffle').onclick = () => { shuffle = !shuffle; save(); paintModes(); toast(shuffle ? 'Aleatorio activado' : 'Aleatorio desactivado') };
$('#btnRepeat').onclick = () => { repeat = {off:'all', all:'one', one:'off'}[repeat]; save(); paintModes();
  toast({off:'Repetir desactivado', all:'Repetir todo', one:'Repetir esta canción'}[repeat]) };
function paintModes(){
  $('#btnShuffle').classList.toggle('on', shuffle); $('#btnRepeat').classList.toggle('on', repeat !== 'off');
  $('#btnRepeat').innerHTML = repeat === 'one'
    ? '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2zm-4-2V9h-1l-2 1v1h1.5v4z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>';
}
paintModes();

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => { userPaused = false; keepAlive(true); player?.playVideo() });
  navigator.mediaSession.setActionHandler('pause', () => { userPaused = true; player?.pauseVideo(); keepAlive(false); navigator.mediaSession.playbackState = 'paused' });
  try { navigator.mediaSession.setActionHandler('seekto', e => player?.seekTo(e.seekTime, true)) } catch {}
  navigator.mediaSession.setActionHandler('nexttrack', () => next());
  navigator.mediaSession.setActionHandler('previoustrack', prev);
}

let seeking = false;
$('#seek').addEventListener('input', () => seeking = true);
$('#seek').addEventListener('change', e => { if (ready) player.seekTo(player.getDuration() * e.target.value / 100, true); seeking = false });
setInterval(() => {
  if (!ready || !player.getDuration) return;
  const d = player.getDuration(), c = player.getCurrentTime(), pct = d ? c / d * 100 : 0;
  $('#tCur').textContent = fmt(c); $('#tDur').textContent = fmt(d);
  $('#mBar').style.width = pct + '%';
  if (d && 'mediaSession' in navigator && navigator.mediaSession.setPositionState) {
    try { navigator.mediaSession.setPositionState({ duration: d, position: Math.min(c, d), playbackRate: 1 }) } catch {}
  }
  if (!seeking) $('#seek').value = pct;
}, 500);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay() }
  if (e.code === 'Escape' && sheetOpen) leaveSheet();
});

// ---------- Búsqueda ----------
function videoIdFrom(text){
  const m = text.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function playlistIdFrom(text){ const m = text.match(/[?&]list=([\w-]+)/); return m ? m[1] : null }
async function infoFor(id){
  try {
    const r = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v='+id)}&format=json`);
    if (r.ok) { const j = await r.json(); return { id, title: j.title, channel: j.author_name } }
  } catch {}
  return { id, title: 'Video ' + id, channel: 'YouTube' };
}
async function search(){
  const q = $('#q').value.trim(); if (!q) return;
  $('#q').blur();
  const listId = playlistIdFrom(q), vid = videoIdFrom(q);
  if (listId && apiKey) return importPlaylist(listId);
  if (vid) { renderResults([await infoFor(vid)]); $('#searchHint').textContent = ''; return }
  if (!apiKey) { $('#searchHint').textContent = 'Para buscar por nombre agrega tu API key en Ajustes. Mientras, pega el link de un video.'; return }
  lastQuery = q; nextPage = ''; lastResults = [];
  $('#searchHint').textContent = 'Buscando…';
  await fetchResults();
}
async function fetchResults(){
  $('#moreBtn')?.remove();
  try {
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=50&regionCode=MX&relevanceLanguage=es&q=${encodeURIComponent(lastQuery)}&key=${apiKey}${nextPage ? '&pageToken=' + nextPage : ''}`;
    const j = await (await fetch(url)).json();
    if (j.error) throw new Error(j.error.message);
    const seen = new Set(lastResults.map(t => t.id));
    const items = j.items.filter(it => it.id.videoId && !seen.has(it.id.videoId))
      .map(it => ({ id: it.id.videoId, title: decode(it.snippet.title), channel: decode(it.snippet.channelTitle) }));
    nextPage = j.nextPageToken || '';
    renderResults([...lastResults, ...items]);
    $('#searchHint').textContent = lastResults.length ? '' : 'Sin resultados. Prueba con otro nombre.';
    if (nextPage) {
      const b = document.createElement('button'); b.id = 'moreBtn'; b.className = 'btn ghost';
      b.style.cssText = 'display:block;margin:16px auto'; b.textContent = 'Cargar más resultados';
      b.onclick = () => { b.textContent = 'Cargando…'; b.disabled = true; fetchResults() };
      $('#results').after(b);
    }
  } catch (err) { $('#searchHint').textContent = 'La búsqueda falló: ' + err.message + '. Revisa tu API key en Ajustes.' }
}
async function importPlaylist(listId){
  $('#searchHint').textContent = 'Importando playlist…';
  try {
    let tracks = [], page = '', name = 'Playlist importada';
    const info = await (await fetch(`https://www.googleapis.com/youtube/v3/playlists?part=snippet&id=${listId}&key=${apiKey}`)).json();
    if (info.items?.[0]) name = decode(info.items[0].snippet.title);
    do {
      const j = await (await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${listId}&key=${apiKey}${page ? '&pageToken='+page : ''}`)).json();
      if (j.error) throw new Error(j.error.message);
      tracks.push(...j.items.filter(i => i.snippet.resourceId?.videoId && i.snippet.title !== 'Private video')
        .map(i => ({ id: i.snippet.resourceId.videoId, title: decode(i.snippet.title), channel: decode(i.snippet.videoOwnerChannelTitle || '') })));
      page = j.nextPageToken;
    } while (page && tracks.length < 500);
    library.push({ id: 'pl' + Date.now(), name, tracks }); save();
    $('#searchHint').textContent = `Importada “${name}” con ${tracks.length} canciones. Está en Tu biblioteca.`;
  } catch (err) { $('#searchHint').textContent = 'No se pudo importar: ' + err.message }
}
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') search() });

// ---------- Render ----------
const ICON_PLUS = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm1-13h-2v4H7v2h4v4h2v-4h4v-2h-4z"/></svg>';
const ICON_QUEUE = '<svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 5h12v2H3zm0 5h8v2H3zm14-2v-3h2v3h3v2h-3v3h-2v-3h-3v-2z"/></svg>';
const ICON_DEL = '<svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7zm3-4h6l1 2h4v2H4V5h4z"/></svg>';

function trackRow(t, opts){
  const li = document.createElement('li'); li.className = 'track'; li.dataset.id = t.id;
  li.innerHTML = `<img src="${thumb(t.id)}" alt="" loading="lazy">
    <button class="t-main"><div class="t-title">${esc(t.title)}</div><div class="t-sub">${esc(t.channel)}</div></button>
    ${opts.add ? `<button class="icon-btn" data-a="add" aria-label="Agregar a playlist">${ICON_PLUS}</button>` : ''}
    ${opts.queue ? `<button class="icon-btn" data-a="queue" aria-label="Agregar a la cola">${ICON_QUEUE}</button>` : ''}
    ${opts.del ? `<button class="icon-btn" data-a="del" aria-label="Quitar">${ICON_DEL}</button>` : ''}`;
  li.querySelector('.t-main').onclick = opts.onPlay;
  li.querySelector('[data-a=add]')?.addEventListener('click', () => askPlaylist(t));
  li.querySelector('[data-a=queue]')?.addEventListener('click', () => enqueue(t));
  li.querySelector('[data-a=del]')?.addEventListener('click', opts.onDel);
  return li;
}
function coverFor(tracks){
  const ids = [...new Set(tracks.map(t => t.id))];
  if (!ids.length) return '<div class="cover one"></div>';
  if (ids.length < 4) return `<div class="cover one"><img src="${thumb(ids[0])}" alt=""></div>`;
  return `<div class="cover">${ids.slice(0,4).map(id => `<img src="https://i.ytimg.com/vi/${id}/default.jpg" alt="">`).join('')}</div>`;
}
function renderHome(){
  const box = $('#home'); box.innerHTML = '';
  if (!recents.length && !library.some(p => p.tracks.length)) {
    box.innerHTML = `<div class="welcome"><h2 class="sec" style="margin-top:0">Empieza a escuchar</h2>
      <p>Busca una canción, tócala para reproducirla y guárdala en tus playlists con el botón +.</p>
      <button class="btn" id="goSearch">Buscar música</button></div>`;
    $('#goSearch').onclick = () => showView('buscar'); return;
  }
  const grid = document.createElement('div'); grid.className = 'grid';
  library.filter(p => p.tracks.length).slice(0, 8).forEach(pl => {
    const b = document.createElement('button'); b.className = 'tile';
    b.innerHTML = `${coverFor(pl.tracks)}<b>${esc(pl.name)}</b>`;
    b.onclick = () => playList(pl.tracks, 0);
    grid.appendChild(b);
  });
  if (grid.children.length) box.appendChild(grid);
  if (recents.length) {
    box.insertAdjacentHTML('beforeend', '<h2 class="sec">Escuchado recientemente</h2>');
    const shelf = document.createElement('div'); shelf.className = 'shelf';
    recents.forEach(t => {
      const c = document.createElement('button'); c.className = 'card';
      c.innerHTML = `<img src="https://i.ytimg.com/vi/${t.id}/hqdefault.jpg" alt="" loading="lazy"><b>${esc(t.title)}</b><span>${esc(t.channel)}</span>`;
      c.onclick = () => playNow(t);
      shelf.appendChild(c);
    });
    box.appendChild(shelf);
  }
}
function renderResults(items){
  lastResults = items;
  const ul = $('#results'); ul.innerHTML = '';
  items.forEach(t => ul.appendChild(trackRow(t, { add:true, queue:true, onPlay: () => playNow(t) })));
  markPlaying();
}
function renderLibrary(){
  const box = $('#library'); box.innerHTML = '';
  library.forEach(pl => {
    const head = document.createElement('div'); head.className = 'pl-head';
    head.innerHTML = `${coverFor(pl.tracks).replace('class="cover', 'style="border-radius:6px" class="cover')}
      <h2>${esc(pl.name)}<div class="t-sub">Playlist · ${pl.tracks.length} canciones</div></h2>
      <button class="icon-btn" data-a="play" aria-label="Reproducir playlist" style="color:var(--accent)" ${pl.tracks.length ? '' : 'disabled'}><svg viewBox="0 0 24 24" style="width:34px;height:34px"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 14.5v-9l6 4.5z"/></svg></button>
      ${pl.id !== 'fav' ? `<button class="icon-btn" data-a="del" aria-label="Borrar playlist">${ICON_DEL}</button>` : ''}`;
    head.querySelector('[data-a=play]').onclick = () => playList(pl.tracks, 0);
    head.querySelector('[data-a=del]')?.addEventListener('click', () => {
      if (confirm(`¿Borrar la playlist “${pl.name}”?`)) { library = library.filter(p => p !== pl); save(); renderLibrary() }
    });
    box.appendChild(head);
    const ul = document.createElement('ul'); ul.className = 'list';
    if (!pl.tracks.length) ul.innerHTML = '<li class="empty">Vacía. Agrega canciones desde Buscar con el botón +.</li>';
    pl.tracks.forEach((t, i) => ul.appendChild(trackRow(t, { queue:true, del:true, onPlay: () => playList(pl.tracks, i),
      onDel: () => { pl.tracks.splice(i,1); save(); renderLibrary() } })));
    box.appendChild(ul);
  });
  markPlaying();
}
function renderQueue(){
  const ul = $('#queue'); ul.innerHTML = '';
  if (!queue.length) { ul.innerHTML = '<li class="empty">La cola está vacía. Reproduce una playlist o agrega canciones.</li>'; return }
  queue.forEach((t, i) => {
    const li = trackRow(t, { del:true, onPlay: () => { index = i; save(); loadTrack(t) },
      onDel: () => { queue.splice(i,1); if (i < index) index--; else if (i === index) { index = Math.min(index, queue.length-1); if (queue[index]) loadTrack(queue[index]) } save(); renderQueue() } });
    if (i === index) li.classList.add('playing');
    ul.appendChild(li);
  });
}
function markPlaying(){
  const cur = current()?.id;
  document.querySelectorAll('#results .track, #library .track').forEach(li => li.classList.toggle('playing', li.dataset.id === cur));
}

// ---------- Playlists ----------
function askPlaylist(t){
  const box = $('#addOpts'); box.innerHTML = '';
  library.forEach(pl => {
    const has = pl.tracks.some(x => x.id === t.id);
    const b = document.createElement('button'); b.textContent = (has ? '✓ ' : '') + pl.name;
    b.onclick = () => { if (!has) pl.tracks.push(t); save(); $('#dlgAdd').close(); toast(has ? `Ya está en ${pl.name}` : `Agregada a ${pl.name}`) };
    box.appendChild(b);
  });
  $('#dlgAdd').showModal();
}
$('#btnNewPl').onclick = () => {
  const name = $('#newPl').value.trim(); if (!name) return;
  library.push({ id: 'pl' + Date.now(), name, tracks: [] }); $('#newPl').value = ''; save(); renderLibrary();
};
$('#btnClearQ').onclick = () => { queue = current() ? [current()] : []; index = queue.length ? 0 : -1; save(); renderQueue() };

// ---------- Ajustes ----------
$('#btnSettings').onclick = () => { $('#apiKey').value = apiKey; $('#dlgSettings').showModal() };
$('#btnSaveKey').onclick = () => { apiKey = $('#apiKey').value.trim(); store.set('rolas.key', apiKey); toast('Guardado'); $('#dlgSettings').close() };
$('#btnExport').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(library, null, 1)], { type: 'application/json' }));
  a.download = 'rolas-biblioteca.json'; a.click();
};
$('#btnImport').onclick = () => $('#fileImport').click();
$('#fileImport').onchange = async e => {
  try { const data = JSON.parse(await e.target.files[0].text()); if (!Array.isArray(data)) throw 0;
    library = data; save(); renderLibrary(); toast('Biblioteca importada') } catch { toast('Ese archivo no es una biblioteca de Rolas') }
};

// ---------- Arranque ----------
showView('inicio');
if (current()) showTrackInfo(current());
if (!apiKey) $('#searchHint').textContent = 'Pega el link de un video de YouTube, o agrega tu API key en Ajustes para buscar por nombre.';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
